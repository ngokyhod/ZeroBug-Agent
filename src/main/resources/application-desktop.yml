# Profile "desktop" — chạy standalone, không cần PostgreSQL/Docker
spring:
  config:
    activate:
      on-profile: desktop

  datasource:
    url: jdbc:h2:file:${ZEROBUG_DATA_DIR:./data}/zerobugdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

zerobug:
  storage:
    path: ${ZEROBUG_DATA_DIR:./data}/projects
  app:
    base-url: http://127.0.0.1:${SERVER_PORT:8080}
  mail:
    dev-mode: true
