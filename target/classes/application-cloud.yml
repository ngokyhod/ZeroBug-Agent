# Profile "cloud" — deploy on AWS EC2: RDS + S3 + Bedrock
spring:
  config:
    activate:
      on-profile: cloud

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:zerobug}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

zerobug:
  storage:
    type: s3
    path: ${STORAGE_PATH:./data/import-work}
    s3-bucket: ${S3_BUCKET:zerobug-projects-goninit}
    s3-region: ${AWS_REGION:ap-southeast-1}
  app:
    base-url: ${APP_BASE_URL:http://18.143.180.5:8080}
  mail:
    dev-mode: true
  aws:
    enabled: true
    region: ${AWS_REGION:ap-southeast-1}
    bedrock-region: ${BEDROCK_REGION:us-east-1}
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}
